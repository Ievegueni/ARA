# Nginx no VPS: serve o frontend estático e faz proxy da API.
server {
    listen 80;
    server_name ara.exemplo.ao;  # ajustar domínio (e ativar HTTPS com certbot)

    root /var/www/ara/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming SSE das respostas do chat
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
